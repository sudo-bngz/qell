name: Website

# Builds the landing page (site/) and the user documentation (docs/, mdBook)
# into one GitHub Pages site: / is the landing page, /docs/ the book.
# Pull requests only build it; pushes to main publish it.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40
      - name: Build
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mdbook build docs -d "$PWD/_site/docs"
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
