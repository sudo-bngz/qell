[package]
name = "qell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qell"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
dirs.workspace = true
egui.workspace = true
egui_commonmark.workspace = true
eframe.workspace = true
rfd.workspace = true
devicons.workspace = true
qell-core.workspace = true
qell-lsp.workspace = true
qell-term.workspace = true
qell-plugins.workspace = true
qell-git.workspace = true
qell-index.workspace = true
qell-k8s.workspace = true
qell-table.workspace = true
qell-aws.workspace = true
image.workspace = true
# Native menu bar. Built on every platform (without GTK) so the menu code is
# compiled and tested everywhere; it is only installed on macOS.
muda = { version = "0.21", default-features = false }
# Delete in the file tree moves to the Trash / Recycle Bin, never erases.
trash = "5"
# Vim mode: `/` search and `:s`.
regex = "1"
# Line diff against git, for the change marks in the gutter.
similar = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# How much memory Qell uses (proc_pid_rusage), for the memory guard.
libc = "0.2"
# Reads the clipboard for Edit → Paste in the native menu.
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"
